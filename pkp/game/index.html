{no:2,type:'อุทาหรณ์',pts:60,mins:72,c:'var(--red)',title:'ถนนชำรุด · ละเลยต่อหน้าที่',
 prompt:'เทศบาลตำบลสายชลมีหน้าที่ตามกฎหมายในการดูแลรักษาถนนสายหลักในเขตเทศบาล ถนนช่วงหน้าตลาดเป็นหลุมลึกมาประมาณสามเดือน ประชาชนร้องเรียนหลายครั้ง แต่เทศบาลไม่ซ่อมและไม่ติดตั้งป้ายเตือนใด ๆ เมื่อวันที่ 10 มกราคม 2569 เวลากลางคืน นายขจรขับรถจักรยานยนต์ตกหลุมได้รับบาดเจ็บ เสียค่ารักษาพยาบาล 120,000 บาท นายขจรยื่นคำขอต่อเทศบาลให้ชดใช้ค่าสินไหมทดแทน เทศบาลไม่มีคำวินิจฉัยภายใน 180 วัน และชี้แจงว่างบประมาณซ่อมถนนยังไม่ได้รับอนุมัติ นายขจรจึงประสงค์จะฟ้องคดี\n\nให้วินิจฉัยว่า นายขจรต้องฟ้องผู้ใด ต่อศาลใด ภายในกำหนดเวลาเท่าใด และข้ออ้างของเทศบาลรับฟังได้หรือไม่',
 steps:[
 {k:'highlight',w:12,code:'ห',title:'🖍️ ขีดสำนวน',q:'เลือกปากกาแล้วแตะข้อความ · ส้ม = ข้อเท็จจริงที่ใช้ปรับบท · แดง = ข้อเท็จจริงล่อที่ต้องหักล้าง',segs:[
  ['เทศบาลตำบลสายชล','use'],['มีหน้าที่ตามกฎหมายในการดูแลรักษาถนน','use'],['สายหลักในเขตเทศบาล',0],['ถนนเป็นหลุมลึกมาประมาณสามเดือน','use'],['ประชาชนร้องเรียนหลายครั้ง','use'],['เทศบาลไม่ซ่อมและไม่ติดตั้งป้ายเตือน','use'],['เวลากลางคืน',0],['นายขจรตกหลุมได้รับบาดเจ็บ','use'],['ยื่นคำขอต่อเทศบาลให้ชดใช้','trap'],['ไม่มีคำวินิจฉัยภายใน 180 วัน',0],['งบประมาณซ่อมถนนยังไม่ได้รับอนุมัติ','trap']],
  why:'ข้อเท็จจริงล่อ 2 จุด: <b>การยื่นคำขอ</b> (ไม่ได้ตัดสิทธิฟ้อง) และ<b>งบประมาณยังไม่อนุมัติ</b> (ไม่ทำให้พ้นหน้าที่ เพราะอย่างน้อยติดป้ายเตือนได้)'},
 {k:'gate',w:12,code:'ม',title:'🚪 ประตูรับฟ้อง',q:'เปิดประตูตามลำดับ · พิมพ์เลขมาตรา',gates:[
  {q:'ศป. — เทศบาลเป็นหน่วยงานทางปกครอง (มาตรา)',a:['3']},
  {q:'ศป. — คดีละเมิดจากการละเลยต่อหน้าที่ (มาตรา … วรรคหนึ่ง (3))',a:['9']},
  {q:'ละเมิด — ฟ้องหน่วยงานโดยตรง ฟ้องเจ้าหน้าที่ไม่ได้ (มาตรา)',a:['5']},
  {q:'ศป. — ระยะเวลาฟ้องคดีละเมิด 1 ปี / ไม่เกิน 10 ปี (มาตรา)',a:['51']}],
  why:'<span class="sec">ศป. ม.3</span> → <span class="sec">ม.9 ว.1 (3)</span> → <span class="sec">ละเมิด ม.5</span> → <span class="sec">ศป. ม.51</span>'},
 {k:'duel',w:12,code:'ห',title:'⚔️ ดวลทนายฝ่ายเทศบาล',rounds:[
  {arg:'"งบประมาณซ่อมถนนยังไม่ได้รับอนุมัติ เทศบาลจึงไม่ได้ละเลยต่อหน้าที่"',
   mae:['แม้งบประมาณซ่อมถนนจะยังไม่ได้รับอนุมัติ','แม้เทศบาลจะเป็นหน่วยงานทางปกครอง','แม้นายขจรจะขับรถตอนกลางคืน'],ma:0,
   tae:['แต่การซ่อมถนนเป็นอำนาจดุลพินิจของเทศบาล','แต่เทศบาลยังมีหน้าที่ป้องกันอันตรายเบื้องต้นด้วยการติดป้ายเตือน และปล่อยหลุมไว้นานถึงสามเดือนทั้งที่มีผู้ร้องเรียน จึงเป็นการละเลยต่อหน้าที่','แต่นายขจรได้ยื่นคำขอไว้แล้ว'],ta:1},
  {arg:'"นายขจรยื่นคำขอตาม ม.11 ไว้แล้ว จึงฟ้องคดีต่อศาลไม่ได้"',
   mae:['แม้นายขจรจะได้รับบาดเจ็บ','แม้นายขจรจะยื่นคำขอต่อเทศบาลตาม ม.11','แม้คดีจะเป็นคดีละเมิด'],ma:1,
   tae:['แต่การยื่นคำขอเป็นช่องทางทางเลือกที่ไม่ตัดสิทธิฟ้องคดี และเทศบาลไม่วินิจฉัยภายใน 180 วัน นายขจรจึงฟ้องได้','แต่ต้องรอให้เทศบาลวินิจฉัยก่อนเสมอ','แต่ต้องฟ้องศาลยุติธรรม'],ta:0}],
  why:'แต่ละประโยค "แม้…แต่…" ต้องยกข้อเท็จจริงล่อขึ้นมา แล้วหักล้างด้วยหลักกฎหมายพร้อมเลขมาตรา'},
 {k:'timeline',w:9,code:'ต',title:'📅 ปักหมุดเส้นตาย',q:'นายขจรรู้ถึงเหตุแห่งการฟ้องคดีในวันเกิดเหตุ 10 ม.ค. 2569 ต้องฟ้องภายในวันใด',start:'10 ม.ค. 2569',hint:'กำหนดเป็นปี ไม่นับวันแรก ครบกำหนดวันที่ตรงกันของปีถัดไป',opts:['9 ม.ค. 2570','10 ม.ค. 2570','10 เม.ย. 2569','10 ม.ค. 2579'],a:1,pins:[['10 ม.ค. 69 · รู้เหตุ',0],['10 ม.ค. 70 · ครบ 1 ปี',55],['ไม่เกิน 10 ปี',100]],
  why:'<span class="sec">ศป. ม.51</span>: <span class="num">1 ปี</span>นับแต่รู้หรือควรรู้ถึงเหตุแห่งการฟ้องคดี (ไม่นับวันแรก ครบ 1 ปีวันที่ 10 ม.ค. 2570) แต่ไม่เกิน <span class="num">10 ปี</span>นับแต่วันที่มีเหตุ'},
 {k:'build',w:15,code:'บ',title:'🧱 เรียงคำพิพากษา',q:'แตะบล็อกเรียงเป็นย่อหน้าวินิจฉัยตามโครง: ตัวบท → ข้อเท็จจริง → แม้…แต่… → ดังนั้น…จึง…',blocks:[
  'พระราชบัญญัติจัดตั้งศาลปกครองฯ มาตรา 9 วรรคหนึ่ง (3) กำหนดให้ศาลปกครองมีอำนาจพิจารณาคดีพิพาทเกี่ยวกับการกระทำละเมิดที่เกิดจากการละเลยต่อหน้าที่ตามที่กฎหมายกำหนดให้ต้องปฏิบัติ',
  'เมื่อข้อเท็จจริงปรากฏว่าเทศบาลมีหน้าที่ดูแลถนน แต่ปล่อยหลุมลึกไว้สามเดือนโดยไม่ซ่อมและไม่ติดป้ายเตือน จนนายขจรได้รับบาดเจ็บ',
  'แม้เทศบาลจะอ้างว่างบประมาณยังไม่ได้รับอนุมัติ แต่การติดป้ายเตือนเป็นมาตรการเบื้องต้นที่ทำได้ทันที ข้ออ้างจึงรับฟังไม่ได้',
  'ดังนั้น นายขจรจึงต้องฟ้องเทศบาลตำบลสายชลต่อศาลปกครองตามมาตรา 5 แห่งพระราชบัญญัติความรับผิดทางละเมิดฯ ภายในหนึ่งปีตามมาตรา 51'],
  why:'โครงย่อหน้าตามกติกาของคุณ: ตัวบท (กำหนดให้) → ข้อเท็จจริง → แม้…แต่… → ดังนั้น…จึง… (ใช้ครั้งเดียวท้ายย่อหน้า)'}]},

{no:3,type:'อุทาหรณ์',pts:60,mins:72,c:'var(--green)',title:'คำสั่งปิดร้าน · ทุเลาการบังคับ · ละเลยต่อหน้าที่',
 prompt:'(ก) เจ้าพนักงานท้องถิ่นมีคำสั่งปิดร้านอาหารของนางคำแก้ว 30 วัน อ้างว่าร้านปล่อยน้ำเสียลงลำราง โดยอาศัยผลตรวจคุณภาพน้ำซึ่งระบุเลขที่ตั้งของร้านข้างเคียง นางคำแก้วอุทธรณ์ตามกฎหมายแล้ว ผู้มีอำนาจพิจารณาอุทธรณ์มีคำวินิจฉัยยกอุทธรณ์ นางคำแก้วจึงฟ้องขอเพิกถอนคำสั่ง และขอให้ศาลทุเลาการบังคับ เพราะร้านมีลูกจ้าง 20 คน และวัตถุดิบที่สั่งไว้ล่วงหน้าจะเน่าเสีย เจ้าพนักงานท้องถิ่นแถลงว่าการทุเลาจะทำให้คำสั่งของเจ้าหน้าที่ไร้ผลและเป็นอุปสรรคต่อการบริหารงานของรัฐ\n\n(ข) ต่อมานางคำแก้วพบว่าโรงงานต้นน้ำเป็นผู้ปล่อยน้ำเสียจริง จึงมีหนังสือลงวันที่ 1 มกราคม 2569 ร้องขอให้เทศบาลดำเนินการตามอำนาจหน้าที่ แต่เทศบาลเพิกเฉย โดยกฎหมายมิได้กำหนดระยะเวลาให้เทศบาลต้องดำเนินการไว้\n\nให้วินิจฉัยว่า ศาลควรสั่งทุเลาการบังคับหรือไม่ และนางคำแก้วต้องฟ้องคดีตาม (ข) ภายในวันใด',
 steps:[
 {k:'evidence',w:12,code:'บ',title:'🔍 ไต่สวนหาพยาน',q:'ในระบบไต่สวน ตุลาการเรียกพยานหลักฐานเองได้ เลือกพยานที่ช่วยพิสูจน์เงื่อนไขการทุเลา (เลือกได้หลายข้อ)',opts:[
  ['ผลตรวจคุณภาพน้ำที่ระบุเลขที่ตั้งของร้านข้างเคียง',true],['บัญชีรายชื่อลูกจ้างและสัญญาซื้อวัตถุดิบล่วงหน้า',true],['ข้อมูลว่าร้านเดียวปิด 30 วันไม่กระทบบริการสาธารณะ',true],['ใบประกาศเกียรติคุณร้านอาหารยอดนิยม',false],['รายชื่อร้านอื่นในซอยที่ไม่ถูกตรวจ',false]],
  why:'พยานต้องตอบเงื่อนไขทุเลาสามข้อ: คำสั่ง<b>น่าจะไม่ชอบ</b> (ผลตรวจเป็นของร้านอื่น) · <b>เสียหายร้ายแรงยากเยียวยา</b> (ลูกจ้าง วัตถุดิบ) · <b>ไม่เป็นอุปสรรค</b>ต่อการบริหารงานของรัฐหรือบริการสาธารณะ'},
 {k:'recall',w:15,code:'ป',title:'✍️ เงื่อนไขทุเลาการบังคับ',decoy:['ผู้ฟ้องคดีวางเงินประกันเต็มจำนวนความเสียหาย','คำสั่งออกโดยผู้บังคับบัญชาระดับสูง'],q:'พิมพ์เงื่อนไขที่ศาลใช้สั่งทุเลาการบังคับตามกฎหรือคำสั่งให้ครบ 3 ข้อ',items:[
  {label:'กฎหรือคำสั่งนั้นน่าจะไม่ชอบด้วยกฎหมาย',kw:['ไม่ชอบ']},
  {label:'การให้กฎหรือคำสั่งมีผลใช้บังคับต่อไปจะทำให้เกิดความเสียหายอย่างร้ายแรงที่ยากแก่การเยียวยาแก้ไขในภายหลัง',kw:['ร้ายแรง','เยียวยา']},
  {label:'การทุเลาไม่เป็นอุปสรรคแก่การบริหารงานของรัฐหรือแก่บริการสาธารณะ',kw:['อุปสรรค','บริการสาธารณะ','บริหารงาน']}],
  why:'<span class="sec">ศป. ม.66</span> ประกอบระเบียบของที่ประชุมใหญ่ตุลาการในศาลปกครองสูงสุดฯ · ต้องครบทั้งสามเงื่อนไข'},
 {k:'duel',w:12,code:'ห',title:'⚔️ ดวลเจ้าพนักงานท้องถิ่น',rounds:[
  {arg:'"การทุเลาจะทำให้คำสั่งของเจ้าหน้าที่ไร้ผล และเป็นอุปสรรคต่อการบริหารงานของรัฐ"',
   mae:['แม้การทุเลาจะทำให้คำสั่งยังไม่มีผลบังคับชั่วคราว','แม้นางคำแก้วจะอุทธรณ์แล้ว','แม้ร้านจะมีลูกจ้าง 20 คน'],ma:0,
   tae:['แต่คำสั่งเจ้าหน้าที่ต้องมีผลบังคับเสมอ','แต่คำสั่งนี้กระทบร้านเดียว และผลตรวจที่อ้างเป็นของร้านข้างเคียง การทุเลาจึงไม่เป็นอุปสรรคต่อการบริหารงานของรัฐหรือบริการสาธารณะ','แต่ศาลต้องรอพิพากษาก่อน'],ta:1}],
  why:'ข้ออ้างว่า "คำสั่งจะไร้ผล" เป็นผลปกติของการทุเลาทุกคดี จึงไม่ใช่เหตุที่จะไม่ทุเลา ต้องดูว่ากระทบการบริหารงานของรัฐหรือบริการสาธารณะจริงหรือไม่'},
 {k:'timeline',w:12,code:'ต',title:'📅 ม.49 ทางที่สอง',q:'นางคำแก้วมีหนังสือร้องขอวันที่ 1 ม.ค. 2569 เทศบาลเงียบ (กฎหมายไม่กำหนดเวลาไว้) ต้องฟ้องภายในวันใด',start:'1 ม.ค. 2569',hint:'มีหนังสือ → รอ 90 วัน (ครบ 1 เม.ย.) → นับต่ออีก 90 วัน',opts:['31 มี.ค. 2569','1 เม.ย. 2569','30 มิ.ย. 2569','1 ม.ค. 2570'],a:2,pins:[['1 ม.ค. · มีหนังสือ',0],['1 เม.ย. · พ้น 90 วัน',50],['30 มิ.ย. · วันสุดท้าย',100]],
  why:'<span class="sec">ศป. ม.49</span>: ฟ้องภายใน <span class="num">90 วัน</span>นับแต่วันที่<b>พ้นกำหนด 90 วัน</b>นับแต่มีหนังสือร้องขอ → ช่วงแรกครบ 1 เม.ย. 2569 → ช่วงที่สองครบ 30 มิ.ย. 2569 (ไม่นับวันแรกทั้งสองช่วง) · ปี 2569 เดือนกุมภาพันธ์มี 28 วัน'},
 {k:'gate',w:9,code:'ม',title:'🚪 ประตูมาตรา',q:'พิมพ์เลขมาตรา',gates:[
  {q:'ศป. — คุ้มครองชั่วคราว / ทุเลาการบังคับ',a:['66']},
  {q:'ศป. — ต้องดำเนินการตามขั้นตอนแก้ไขความเดือดร้อนก่อนฟ้อง (มาตรา … วรรคสอง)',a:['42']},
  {q:'ศป. — คดีละเลยต่อหน้าที่หรือล่าช้าเกินสมควร (มาตรา … วรรคหนึ่ง (2))',a:['9']}],

const app=document.getElementById('app'),dockEl=document.getElementById('dock'),dockIn=document.getElementById('dockIn');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thd=s=>String(s).replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
const normNum=s=>{const m=thd(s).match(/\d+(?:\/\d+)?/);return m?m[0]:''};
const normEn=s=>s.toLowerCase().replace(/[‐-—]/g,'-').replace(/[^a-z\- ]/g,' ').replace(/\s+/g,' ').trim();
let best=store.get('courtBest',{});
let EASY=store.get('courtEasy',true);
const THEMES=[['cream','☀️ ครีม'],['mint','🌊 มินต์'],['dark','🌙 มืด']];
function curTheme(){return document.documentElement.dataset.theme||'cream'}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('courtTheme',t)}catch(e){}const m={cream:'#f4ecdc',mint:'#eaf4f4',dark:'#1d1b18'}[t];document.querySelectorAll('meta[name=theme-color]').forEach(x=>x.setAttribute('content',m))}
function dock(btns){dockIn.innerHTML='';btns.forEach(([l,f,m,dis])=>{const b=document.createElement('button');b.className='btn'+(m?' main':'');b.textContent=l;b.onclick=f;if(dis)b.disabled=true;dockIn.appendChild(b)});dockEl.hidden=!btns.length}
const RANKS=[[0,'พนักงานคดีปกครอง'],[40,'ตุลาการศาลปกครองชั้นต้น'],[55,'ตุลาการหัวหน้าคณะ'],[70,'ตุลาการศาลปกครองสูงสุด'],[85,'ประธานศาลปกครองสูงสุด']];

/* ---------- หน้าแรก ---------- */
function home(){window.scrollTo(0,0);dock([]);
 let h='<h1>⚖️ ตุลาการเจ้าของสำนวน</h1><p class="sub">เกมข้อสอบจำลองพนักงานคดีปกครอง · รูปแบบตามข้อสอบจริง: อุทาหรณ์ · บรรยาย · แปลสองทิศทาง</p>';
 h+='<div class="card" style="--c:var(--gold)"><div class="lbl" style="margin-top:0">ระดับความยาก</div><div class="slotrow" id="diff"><button class="slot" data-e="1" aria-pressed="'+EASY+'">🌱 ง่าย · แตะเลือก มีคำใบ้ ลองใหม่ได้ 1 ครั้ง</button><button class="slot" data-e="0" aria-pressed="'+!EASY+'">🔥 ปกติ · พิมพ์เอง ไม่มีคำใบ้</button></div><div class="lbl">ธีมสี</div><div class="slotrow" id="thm">'+THEMES.map(([k,l])=>'<button class="slot" data-t="'+k+'" aria-pressed="'+(curTheme()===k)+'">'+l+'</button>').join('')+'</div></div>';
 h+='<h2>โหมด B · ข้อสอบจำลองแบบเกม</h2>';
 h+=tileHTML('A','📝',PAPER_A.name,PAPER_A.sub,'var(--navy)',best.A!=null?'🏆 '+best.A+'/200':'');
 h+='<div class="card" style="--c:var(--line)"><b>ชุด ข (แบบปี 2562 · ข้อ ก/ข) และชุด ค (แบบปี 2567)</b><div class="hint">จะเพิ่มหลังสอบ ตามร่างที่ตกลงไว้</div></div>';
 h+='<h2 style="margin-top:18px">โหมด A · ห้องฝึกแยกประเภท</h2>';
 ROOMS.forEach(r=>{h+=tileHTML(r.id,r.name.split(' ')[0],r.name.slice(r.name.indexOf(' ')+1),r.sub+' · '+r.steps.length+' ด่าน',r.c,best[r.id]!=null?'🏆 '+best[r.id]+'%':'')});
 h+='<p class="hint" style="margin-top:16px">กลไก: 🖍️ ขีดสำนวน · 🚪 ประตูมาตรา · 🔍 ไต่สวน · ⚔️ ดวลทนาย · 📅 เส้นเวลา · 🧮 คำนวณ · 🧱 เรียงคำพิพากษา · 🗂️ โครงบรรยาย · ✍️ ไล่รายการ · ⚖️ เปรียบเทียบ · 🌐 แปล<br>เนื้อหาเพื่อการเตรียมสอบ · ตรวจถ้อยคำเต็มของตัวบทก่อนอ้างอิง · <a href="/pkp/game/quiz.html" style="color:var(--navy)">ควิซสายฟ้า (เกมเดิม)</a> · <a href="/pkp/" style="color:var(--navy)">แฟลชการ์ด</a></p>';
 app.innerHTML=h;

 app.querySelectorAll('#diff .slot').forEach(b=>b.onclick=()=>{EASY=b.dataset.e==='1';store.set('courtEasy',EASY);home()});
 app.querySelectorAll('#thm .slot').forEach(b=>b.onclick=()=>{setTheme(b.dataset.t);home()});
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(id==='A')startPaper(PAPER_A);else startRoom(ROOMS.find(r=>r.id===id))})}
function tileHTML(id,ic,name,sub,c,bst){return '<button class="btn tile" data-go="'+id+'" style="--c:'+c+'"><span class="ic">'+ic+'</span><span><b>'+name+'</b><small>'+sub+'</small></span><span class="best">'+bst+'</span></button>'}

/* ---------- สถานะการเล่น ---------- */
let run=null; // {kind,paper|room, ii (item idx), si (step idx), results:[{item,step,got,w,code,title}], t0}
function startPaper(p){run={kind:'paper',p,ii:0,si:0,res:[],t0:Date.now(),itemT0:Date.now()};intro()}
function startRoom(r){run={kind:'room',r,ii:0,si:0,res:[],t0:Date.now()};step()}
function curItem(){return run.kind==='paper'?run.p.items[run.ii]:{no:'',type:'ฝึก',pts:0,c:run.r.c,title:run.r.name,steps:run.r.steps}}
function intro(){const it=curItem();window.scrollTo(0,0);
 app.innerHTML='<div class="top"><span>'+run.p.name+'</span><span>ข้อ '+it.no+' / '+run.p.items.length+'</span></div>'+
 '<div class="card pop" style="--c:'+it.c+'"><span class="badge">ข้อ '+it.no+' · '+it.type+' · '+it.pts+' คะแนน</span><h2 style="margin-top:8px">'+it.title+'</h2><div class="prompt">'+esc(it.prompt).replace(/\n/g,'<br>')+'</div>'+
 '<p class="hint" style="margin-top:10px">งบเวลาในห้องสอบจริง ~'+it.mins+' นาที · ในเกมแบ่งเป็น '+it.steps.length+' ด่าน: '+it.steps.map(s=>s.title.split(' ')[0]).join(' ')+'</p></div>';
 run.itemT0=Date.now();dock([['🏠',home,false],['เริ่มทำข้อนี้ →',()=>{run.si=0;step()},true]])}

function header(){const it=curItem();const s=it.steps[run.si];
 let st='<div class="steps" style="--c:'+it.c+'">'+it.steps.map((x,i)=>'<i class="'+(i<run.si?'d':i===run.si?'n':'')+'"></i>').join('')+'</div>';
 let h='<div class="top"><span>'+(run.kind==='paper'?run.p.name+' · ข้อ '+it.no+' · '+it.type:run.r.name)+'</span><span class="clock" id="clk"></span></div>'+st;
 if(run.kind==='paper')h+='<details class="card prompt" style="--c:'+it.c+';padding:10px 14px"><summary>📄 โจทย์ข้อ '+it.no+' (แตะเพื่อเปิดอ่าน)</summary><div style="margin-top:6px">'+esc(it.prompt).replace(/\n/g,'<br>')+'</div></details>';
 return h}
let clkT=null;function tick(){clearInterval(clkT);clkT=setInterval(()=>{const e=document.getElementById('clk');if(!e)return;const sec=Math.floor((Date.now()-(run.itemT0||run.t0))/1000);e.textContent='⏱ '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')},500)}

function step(){const it=curItem();const s=it.steps[run.si];window.scrollTo(0,0);
 app.innerHTML=header()+'<div class="card pop" style="--c:'+it.c+'" id="sc"><div class="badge">'+s.title+' · '+s.w+' คะแนน'+(EASY?' · 🌱 ง่าย':'')+'</div><div class="q" style="margin-top:8px">'+(s.q||'')+'</div><div id="body"></div><div id="fb"></div></div>';
 tick();const body=document.getElementById('body');const api=R[s.k](s,body,EASY);let tries=0,first=0;
 const submit=()=>{const g=Math.max(0,Math.min(s.w,api.grade()));
  if(EASY&&tries===0&&g<s.w-0.01){tries=1;first=g;const fb=document.getElementById('fb');
   fb.innerHTML='<div class="fb" style="--c:var(--gold)"><span class="v">ยังไม่ครบ · ได้ '+(Math.round(g*10)/10)+' / '+s.w+'</span><br>ลองแก้คำตอบอีกครั้งได้ 1 ครั้ง (ถ้าแก้แล้วถูก ได้ 80% ของคะแนนเต็ม หรือคงคะแนนเดิมถ้าดีกว่า)'+(s.hint?'<br>💡 '+s.hint:'')+'</div>';
   fb.scrollIntoView({behavior:'smooth',block:'nearest'});
   dock([['ดูเฉลยเลย',()=>{api.reveal();finishStep(s,first)},false],['ส่งอีกครั้ง',submit,true]]);return}
  api.reveal();finishStep(s,tries?Math.max(first,g*.8):g)};
 dock([['ส่งคำตอบ',submit,true]])}
function finishStep(s,got){const it=curItem();got=Math.round(got*10)/10;
 run.res.push({item:it.no,itemTitle:it.title,title:s.title,got,w:s.w,code:s.code});
 const full=got>=s.w-0.01;const fb=document.getElementById('fb');
 fb.innerHTML='<div class="fb" style="--c:'+it.c+'"><span class="v '+(full?'ok':got>0?'':'no')+'">'+(full?'ถูกครบ':got>0?'ได้บางส่วน':'ยังไม่ถูก')+'</span><span class="pts">'+got+' / '+s.w+'</span><br>'+(s.why||'')+'</div>';
 if(!full)document.getElementById('sc').classList.add('shake');
 fb.scrollIntoView({behavior:'smooth',block:'nearest'});
 const last=run.si>=it.steps.length-1;
 dock([[last?(run.kind==='paper'?(run.ii>=run.p.items.length-1?'ดูใบคะแนน':'สรุปข้อนี้ →'):'ดูผล'):'ด่านถัดไป →',()=>{if(!last){run.si++;step()}else if(run.kind==='paper')itemSummary();else roomEnd()},true]])}

function itemSummary(){clearInterval(clkT);const it=curItem();const rs=run.res.filter(r=>r.item===it.no);const got=rs.reduce((a,r)=>a+r.got,0);
 const mins=Math.round((Date.now()-run.itemT0)/60000);window.scrollTo(0,0);
 app.innerHTML='<div class="top"><span>'+run.p.name+'</span><span>จบข้อ '+it.no+'</span></div><div class="card pop" style="--c:'+it.c+'"><span class="badge">ข้อ '+it.no+' · '+it.type+'</span><div class="big" style="margin-top:8px">'+Math.round(got*10)/10+' <span style="font-size:1.2rem;color:var(--mute)">/ '+it.pts+'</span></div>'+
 '<table class="sheet" style="margin-top:8px">'+rs.map(r=>'<tr><td>'+r.title+'</td><td>'+r.got+' / '+r.w+'</td></tr>').join('')+'</table><p class="hint">ใช้เวลาในเกม ~'+mins+' นาที</p></div>';
 const last=run.ii>=run.p.items.length-1;dock([[last?'ดูใบคะแนน 200 คะแนน':'ไปข้อ '+(it.no+1)+' →',()=>{if(last)paperEnd();else{run.ii++;run.si=0;intro()}},true]])}

function codesOf(rs){const m={};rs.forEach(r=>{if(r.got<r.w-0.01)m[r.code]=(m[r.code]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
const CODE_NAME={'ป':'ไม่เห็นประเด็น','ม':'มาตรา','ต':'ตัวเลข/เวลา','บ':'ปรับบท','ห':'หักล้าง แม้…แต่…','ส':'สรุป','ว':'เวลา','ภ':'ภาษา/โครง'};
function paperEnd(){clearInterval(clkT);const p=run.p;const tot=Math.round(run.res.reduce((a,r)=>a+r.got,0)*10)/10;const pct=tot/2;
 if(best[p.id]==null||tot>best[p.id]){best[p.id]=tot;store.set('courtBest',best)}
 const per=p.items.map(it=>[it,Math.round(run.res.filter(r=>r.item===it.no).reduce((a,r)=>a+r.got,0)*10)/10]);
 const cs=codesOf(run.res);window.scrollTo(0,0);
 app.innerHTML='<h1>📋 ใบคะแนน</h1><p class="sub">'+p.name+'</p><div class="card pop"><div class="big">'+tot+' <span style="font-size:1.2rem;color:var(--mute)">/ 200</span></div><div class="rank">🎖️ '+rankOf(pct)+'</div>'+
 '<table class="sheet" style="margin-top:10px">'+per.map(([it,g])=>'<tr><td>ข้อ '+it.no+' · '+it.type+' · '+it.title+'</td><td>'+g+' / '+it.pts+'</td></tr>').join('')+'</table></div>'+
 (cs.length?'<div class="card" style="--c:var(--red)"><b>ลงสมุดจุดอ่อน</b><div class="codes">'+cs.map(([c,n])=>'<span>'+c+' · '+CODE_NAME[c]+' ×'+n+'</span>').join('')+'</div><div style="margin-top:8px">'+run.res.filter(r=>r.got<r.w-0.01).map(r=>'<div class="hint">ข้อ '+r.item+' · '+r.title+' · <b>'+r.code+'</b> · '+r.got+'/'+r.w+'</div>').join('')+'</div></div>':'<div class="card" style="--c:var(--green)"><b>ไม่มีจุดพลาด</b> พร้อมเข้าห้องสอบ</div>');
 dock([['🏠 หน้าแรก',home,false],['🔁 ทำชุดนี้อีกครั้ง',()=>startPaper(p),true]])}
function roomEnd(){clearInterval(clkT);const r=run.r;const tot=run.res.reduce((a,x)=>a+x.got,0),max=run.res.reduce((a,x)=>a+x.w,0);const pct=Math.round(tot/max*100);
 if(best[r.id]==null||pct>best[r.id]){best[r.id]=pct;store.set('courtBest',best)}const cs=codesOf(run.res);window.scrollTo(0,0);
 app.innerHTML='<h1>'+r.name+'</h1><div class="card pop" style="--c:'+r.c+'"><div class="big">'+pct+'%</div><table class="sheet">'+run.res.map(x=>'<tr><td>'+x.title+'</td><td>'+x.got+' / '+x.w+'</td></tr>').join('')+'</table>'+(cs.length?'<div class="codes">'+cs.map(([c,n])=>'<span>'+c+' · '+CODE_NAME[c]+' ×'+n+'</span>').join('')+'</div>':'')+'</div>';
 dock([['🏠 หน้าแรก',home,false],['🔁 เล่นห้องนี้อีกครั้ง',()=>startRoom(r),true]])}

/* =====================================================================
   กลไกแต่ละด่าน: R[k](step, el) → {check(): คะแนน}
   ===================================================================== */
const R={};
const NUMPOOL=['3','5','6','8','9','11','12','13','37','41','42','44','45','49','51','52','53','66','72','73','75','15','30','90','145','194'];
function chipsFor(ans){const pool=sh(NUMPOOL.filter(n=>n!==ans)).slice(0,3);return sh([ans,...pool])}
R.highlight=(s,el,E)=>{let pen='use';const marks=s.segs.map(()=>null);const nU=s.segs.filter(g=>g[1]==='use').length,nT=s.segs.filter(g=>g[1]==='trap').length;
 el.innerHTML=(E?'<div class="hint">💡 มีข้อเท็จจริงที่ใช้ปรับบท '+nU+' จุด · ข้อเท็จจริงล่อ '+nT+' จุด · ขีดเกินหักคะแนนน้อย</div>':'')+'<div class="pens"><button class="pen use" data-p="use" aria-pressed="true">🟧 ใช้ปรับบท</button><button class="pen trap" data-p="trap" aria-pressed="false">🟥 ข้อเท็จจริงล่อ</button><button class="pen erase" data-p="erase" aria-pressed="false">⌫ ลบ</button></div><div style="line-height:2.2">'+s.segs.map((g,i)=>'<span class="seg" data-i="'+i+'">'+esc(g[0])+'</span>').join(' ')+'</div>';
 el.querySelectorAll('.pen').forEach(b=>b.onclick=()=>{pen=b.dataset.p;el.querySelectorAll('.pen').forEach(x=>x.setAttribute('aria-pressed',x===b))});
 el.querySelectorAll('.seg').forEach(sp=>sp.onclick=()=>{const i=+sp.dataset.i;marks[i]=pen==='erase'||marks[i]===pen?null:pen;sp.className='seg'+(marks[i]?' m-'+marks[i]:'')});
 const truth=s.segs.map(g=>g[1]||null);
 return{grade(){let hit=0,bad=0;truth.forEach((t,i)=>{if(t&&marks[i]===t)hit++;else if(marks[i])bad++});return s.w*Math.max(0,hit-bad*(E?.25:.5))/(nU+nT)},
  reveal(){el.querySelectorAll('.seg').forEach((sp,i)=>{sp.onclick=null;if(truth[i]&&marks[i]===truth[i])sp.classList.add('t-ok');else if(truth[i]){sp.className='seg m-'+truth[i]+' t-miss'}else if(marks[i])sp.classList.add('t-bad')});el.querySelectorAll('.pen').forEach(x=>x.onclick=null)}}};
R.gate=(s,el,E)=>{const val=s.gates.map(()=>'');
 el.innerHTML=s.gates.map((g,i)=>'<div class="door" id="d'+i+'" style="flex-wrap:wrap"><span class="lk">🔒</span><span style="flex:1;font-size:.95rem">'+g.q+'</span>'+(E?'<div class="slotrow" style="width:100%;margin:6px 0 0">'+chipsFor(g.a[0]).map(n=>'<button class="slot" data-v="'+n+'" aria-pressed="false" style="font-size:1rem;padding:6px 14px">'+n+'</button>').join('')+'</div>':'<input inputmode="numeric" autocomplete="off" id="g'+i+'">')+'</div>').join('');
 if(E)el.querySelectorAll('.door').forEach((d,i)=>d.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{val[i]=b.dataset.v;d.querySelectorAll('.slot').forEach(z=>z.setAttribute('aria-pressed',z===b))}));
 const get=i=>E?val[i]:normNum(el.querySelector('#g'+i).value);

R.evidence=(s,el,E)=>{const sel=new Set();const order=sh(s.opts.map((o,i)=>i));const need=s.opts.filter(o=>o[1]).length;
 el.innerHTML='<div class="hint">'+(E?'💡 มีพยานที่ใช่ '+need+' รายการ · ':'')+'เลือกได้หลายข้อ · เลือกผิดหักคะแนน</div>'+order.map(i=>'<button class="opt" data-i="'+i+'" aria-pressed="false">'+esc(s.opts[i][0])+'</button>').join('');
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.setAttribute('aria-pressed',sel.has(i))});

R.duel=(s,el,E)=>{const picks=s.rounds.map(()=>({m:null,t:null}));const per=s.w/s.rounds.length;
 let h='<div class="hp"><span>⚖️ คุณ</span><i><b id="hpMe" style="width:100%;background:var(--green)"></b></i><span>🧑‍💼 ฝ่ายรัฐ</span><i><b id="hpOp" style="width:100%;background:var(--red)"></b></i></div>'+(E?'<div class="hint">💡 ท่อน "แม้" ต้องยกข้อเท็จจริงหรือข้ออ้างของอีกฝ่ายขึ้นมา · ท่อน "แต่" ต้องมีเหตุผลทางกฎหมายที่ตอบข้ออ้างนั้นตรง ๆ</div>':'');
 s.rounds.forEach((x,r)=>{h+='<div class="hint" style="margin-top:12px">ยกที่ '+(r+1)+' / '+s.rounds.length+'</div><div class="arg">'+esc(x.arg)+'</div><div class="lbl">ท่อน "แม้…"</div><div data-r="'+r+'" data-k="m"></div><div class="lbl">ท่อน "แต่…"</div><div data-r="'+r+'" data-k="t"></div><div id="dr'+r+'"></div>'});

 el.querySelectorAll('[data-k]').forEach(box=>{const r=+box.dataset.r,k=box.dataset.k;const arr=k==='m'?s.rounds[r].mae:s.rounds[r].tae;sh(arr.map((o,i)=>i)).forEach(i=>{const b=document.createElement('button');b.className='opt';b.textContent=arr[i];b.dataset.i=i;b.setAttribute('aria-pressed','false');b.onclick=()=>{picks[r][k]=i;box.querySelectorAll('.opt').forEach(z=>z.setAttribute('aria-pressed',z===b))};box.appendChild(b)})});
 const sc=()=>{let p=0,won=0;s.rounds.forEach((x,r)=>{const a=picks[r].m===x.ma,b=picks[r].t===x.ta;p+=per*((a?.4:0)+(b?.6:0));if(a&&b)won++});return[p,won]};
 return{grade(){return sc()[0]},reveal(){const[p,won]=sc();el.querySelector('#hpOp').style.width=Math.round(100-won/s.rounds.length*100)+'%';el.querySelector('#hpMe').style.width=Math.round(100-(s.rounds.length-won)/s.rounds.length*100)+'%';
  el.querySelectorAll('[data-k]').forEach(box=>{const r=+box.dataset.r,k=box.dataset.k;const a=k==='m'?s.rounds[r].ma:s.rounds[r].ta;box.querySelectorAll('.opt').forEach(b=>{b.onclick=null;if(+b.dataset.i===a)b.classList.add('right');else if(b.getAttribute('aria-pressed')==='true')b.classList.add('wrong')})});

R.timeline=(s,el,E)=>{let pick=null;el.innerHTML=(E&&s.hint?'<div class="hint">💡 '+s.hint+'</div>':'')+s.opts.map((o,i)=>'<button class="opt" data-i="'+i+'" aria-pressed="false">📌 '+o+'</button>').join('')+'<div id="tlv"></div>';

  el.querySelector('#tlv').innerHTML='<div class="tl"><div class="line"></div>'+s.pins.map((p,i)=>'<div class="pin" style="left:'+Math.min(90,Math.max(10,p[1]))+'%;--c:'+(i===s.pins.length-1?'var(--red)':'var(--navy)')+'"><i></i>'+p[0]+'</div>').join('')+'</div>'}}};
R.calc=(s,el,E)=>{el.innerHTML=(E&&s.hint?'<div class="hint">💡 '+s.hint+'</div>':'')+'<div style="display:flex;gap:8px;align-items:center"><input type="text" inputmode="numeric" id="cv" placeholder="ตัวเลข" style="flex:1;font-size:1.2rem;font-weight:800"><b>'+s.unit+'</b></div>';

R.build=(s,el,E)=>{const order=[];const pool=sh(s.blocks.map((b,i)=>i));let locked=false;
 function draw(){el.innerHTML=(E?'<div class="hint">💡 เริ่มด้วยย่อหน้าที่มีคำว่า "กำหนดให้" และจบด้วย "ดังนั้น…จึง…"</div>':'')+'<div class="lbl">ย่อหน้าของคุณ (แตะเพื่อเอาออก)</div><div class="built" id="bt"></div><div class="lbl">บล็อกที่เหลือ</div><div class="pool" id="pl"></div>';
  order.forEach((i,pos)=>{const b=document.createElement('button');b.className='chip blk';b.textContent=(pos+1)+'. '+s.blocks[i];b.onclick=()=>{if(locked)return;order.splice(pos,1);draw()};el.querySelector('#bt').appendChild(b)});
  pool.filter(i=>!order.includes(i)).forEach(i=>{const b=document.createElement('button');b.className='chip blk';b.textContent=s.blocks[i];b.onclick=()=>{if(locked)return;order.push(i);draw()};el.querySelector('#pl').appendChild(b)})}
 draw();return{grade(){let ok=0;order.forEach((i,pos)=>{if(i===pos)ok++});return s.w*ok/s.blocks.length},reveal(){locked=true;el.insertAdjacentHTML('beforeend','<div class="fb"><b>ลำดับที่ถูก</b><br>'+s.blocks.map((b,i)=>(i+1)+'. '+esc(b)).join('<br>')+'</div>')}}};
R.outline=(s,el,E)=>{const pick=s.blocks.map(()=>null);const order=sh(s.blocks.map((b,i)=>i));
 el.innerHTML=(E?'<div class="hint">💡 ลำดับโครง: หลัก/ความหมาย → ฐานกฎหมาย (มีเลขมาตรา) → องค์ประกอบ/เงื่อนไข → ข้อยกเว้น → ตัวอย่าง (มีข้อเท็จจริงเฉพาะเรื่อง)</div>':'')+order.map(i=>'<div style="margin-top:8px;font-size:.95rem">'+esc(s.blocks[i][0])+'</div><div class="slotrow" data-i="'+i+'">'+s.slots.map((sl,j)=>'<button class="slot" data-j="'+j+'" aria-pressed="false">'+sl+'</button>').join('')+'</div>').join('');
 el.querySelectorAll('.slotrow').forEach(row=>row.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const i=+row.dataset.i;pick[i]=+b.dataset.j;row.querySelectorAll('.slot').forEach(z=>z.setAttribute('aria-pressed',z===b))}));
 return{grade(){let ok=0;s.blocks.forEach((b,i)=>{if(pick[i]===b[1])ok++});return s.w*ok/s.blocks.length},
  reveal(){el.querySelectorAll('.slotrow').forEach(row=>{const i=+row.dataset.i;const a=s.blocks[i][1];row.querySelectorAll('.slot').forEach(b=>{b.onclick=null;const j=+b.dataset.j;if(j===a)b.classList.add('right');else if(j===pick[i])b.classList.add('wrong')})})}}};
R.recall=(s,el,E)=>{let api;
 if(E){const opts=sh([...s.items.map((it,i)=>({t:it.label,ok:true,i})),...(s.decoy||[]).map(t=>({t,ok:false}))]);const sel=new Set();
  el.innerHTML='<div class="hint">💡 โหมดง่าย: แตะเลือกรายการที่ใช่ให้ครบ '+s.items.length+' ข้อ · มีตัวหลอกปนอยู่</div>'+opts.map((o,k)=>'<button class="opt" data-k="'+k+'" aria-pressed="false">'+esc(o.t)+'</button>').join('');
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k))});
  api={grade(){let hit=0,bad=0;opts.forEach((o,k)=>{if(sel.has(k)){o.ok?hit++:bad++}});return s.w*Math.max(0,hit-bad*.5)/s.items.length},reveal(){el.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;b.onclick=null;if(opts[k].ok)b.classList.add('right');else if(sel.has(k))b.classList.add('wrong')})}}}
 else{el.innerHTML='<textarea id="rt" placeholder="ประการแรก …&#10;ประการที่สอง …"></textarea><div class="hint">ระบบตรวจจากคำสำคัญ ไม่ต้องเขียนตรงตัวบททุกคำ</div><div id="rv"></div>';
  const hits=()=>{const t=thd(el.querySelector('#rt').value).replace(/\s+/g,'');return s.items.map(it=>it.kw.some(k=>t.includes(k.replace(/\s+/g,''))))};
  api={grade(){const h=hits();return s.w*h.filter(Boolean).length/s.items.length},reveal(){const h=hits();el.querySelector('#rt').disabled=true;el.querySelector('#rv').innerHTML='<div class="fb">'+s.items.map((it,i)=>'<div style="margin:4px 0">'+(h[i]?'✅':'⬜')+' '+esc(it.label)+'</div>').join('')+'</div>'}}}
 return api};
R.compare=(s,el,E)=>{const pick=s.items.map(()=>null);const order=sh(s.items.map((x,i)=>i));
 el.innerHTML='<div class="hint">แตะปุ่มเพื่อสลับ: '+s.cols[0]+' ⇄ '+s.cols[1]+'</div>'+order.map(i=>'<div class="cmp"><span>'+esc(s.items[i][0])+'</span><button class="btn" data-i="'+i+'">เลือก</button></div>').join('');
 el.querySelectorAll('.cmp .btn').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;pick[i]=pick[i]===0?1:0;b.textContent=s.cols[pick[i]];b.style.background=pick[i]===0?'var(--blue-bg)':'var(--orange-bg)'});
 return{grade(){let ok=0;s.items.forEach((x,i)=>{if(pick[i]===x[1])ok++});return s.w*ok/s.items.length},
  reveal(){el.querySelectorAll('.cmp .btn').forEach(b=>{const i=+b.dataset.i;b.onclick=null;const good=pick[i]===s.items[i][1];b.style.background=good?'var(--green-bg)':'var(--red-bg)';if(!good)b.textContent='→ '+s.cols[s.items[i][1]]})}}};
const TERMDECOY=['adversarial system','administrative officer','judicial review','high court','government officer','investigation','supreme court','public agency'];
R.term=(s,el,E)=>{const val=s.pairs.map(()=>'');
 el.innerHTML=s.pairs.map((p,i)=>{let inner;if(E){const others=s.pairs.filter((q,j)=>j!==i).map(q=>q[1][0]);const pool=sh([...others,...TERMDECOY].filter(x=>!p[1].includes(x))).slice(0,2);inner='<div class="slotrow" data-i="'+i+'">'+sh([p[1][0],...pool]).map(o=>'<button class="slot" data-v="'+esc(o)+'" aria-pressed="false" style="font-size:.95rem;padding:6px 12px">'+esc(o)+'</button>').join('')+'</div>'}else inner='<input type="text" id="tm'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="English">';
  return '<div style="margin:8px 0" id="tw'+i+'"><b>'+p[0]+'</b>'+inner+'</div>'}).join('');
 if(E)el.querySelectorAll('.slotrow').forEach(row=>row.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{val[+row.dataset.i]=b.dataset.v;row.querySelectorAll('.slot').forEach(z=>z.setAttribute('aria-pressed',z===b))}));
 const get=i=>E?val[i]:el.querySelector('#tm'+i).value;const good=i=>s.pairs[i][1].some(a=>normEn(a)===normEn(get(i)));

  reveal(){s.pairs.forEach((p,i)=>{const w=el.querySelector('#tw'+i);w.querySelectorAll('input,.slot').forEach(x=>{x.disabled=true;x.onclick=null});if(!E){const inp=el.querySelector('#tm'+i);inp.style.borderColor=good(i)?'var(--green)':'var(--red)'}else w.querySelectorAll('.slot').forEach(b=>{if(p[1].includes(b.dataset.v))b.classList.add('right');else if(b.getAttribute('aria-pressed')==='true')b.classList.add('wrong')});if(!good(i)&&!E)w.insertAdjacentHTML('beforeend','<div class="hint" style="color:var(--green)">✔ '+p[1][0]+'</div>')})}}};
R.tiles=(s,el,E)=>{const words=s.en.split(' ');const order=[];const pool=sh(words.map((w,i)=>i));let locked=false;
 function draw(){el.innerHTML=(E?'<div class="hint">💡 คำแรกคือ "'+esc(words[0])+'" · เครื่องหมาย , และ . เป็นบล็อกแยก</div>':'')+'<div class="built" id="bt"></div><div class="pool" id="pl"></div>';

 draw();return{grade(){let ok=0;order.forEach((i,pos)=>{if(words[i]===words[pos])ok++});return s.w*ok/words.length},reveal(){locked=true;el.insertAdjacentHTML('beforeend','<div class="fb"><b>เฉลย</b><br>'+esc(s.en.replace(/ ([,.])/g,'$1'))+'</div>')}}};
R.clause=(s,el,E)=>{const pick=s.rows.map(()=>null);
 el.innerHTML=(E?'<div class="hint">💡 เลือกคำแปลที่แปลความ ไม่แปลทีละคำ และใช้ศัพท์ทางการของศาลปกครอง</div>':'')+s.rows.map((r,i)=>'<div style="margin-top:12px"><b>'+esc(r.en)+'</b><div data-r="'+i+'">'+sh(r.o.map((o,j)=>j)).map(j=>'<button class="opt" data-j="'+j+'" aria-pressed="false">'+esc(r.o[j])+'</button>').join('')+'</div></div>').join('');
 el.querySelectorAll('[data-r]').forEach(box=>box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{pick[+box.dataset.r]=+b.dataset.j;box.querySelectorAll('.opt').forEach(z=>z.setAttribute('aria-pressed',z===b))}));
